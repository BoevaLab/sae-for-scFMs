defaults:
  - data: lung
  - _self_

model_dir: data/geneformer                           # pretrained Geneformer
dataset: data/${data.name}/${data.name}.dataset      # from scripts.geneformer_tokenize
output_dir: data/geneformer_finetuned_${data.name}   # finetuned model; checkpoints in training/, logs in logging/

training:  # continued masked-gene pretraining (GeneformerPretrainer)
  learning_rate: 1.0e-4
  lr_scheduler_type: linear
  warmup_steps: 500
  weight_decay: 0.001
  per_device_train_batch_size: 2
  num_train_epochs: 1
  saves_per_epoch: 8
  logging_steps: 1000


hydra:
  run:
    dir: ${output_dir}/logging
