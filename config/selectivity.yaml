defaults:
  - sae_inference: batchtopk
  - _self_

# SAE checkpoint to load (required)
sae_checkpoint:
  experiment: "multiprocessing"
  timestamp: 'Apr24-15-48'

accum_device: cpu  # cuda is faster when four [features, genes] float64 tables fit next to the model

table:  # features.parquet
  min_support: 1000  # genes a feature fired on at least this often enter expr_focus / expr_std
  top_k: [5, 20, 50]


hydra:
  job:
    chdir: False 
  run:
    dir: experiments/selectivity/${sae_checkpoint.experiment}/${sae_checkpoint.timestamp}/
  job_logging:
    handlers:
      file:
        filename: ${hydra.run.dir}/run.log