defaults:
  - sae_inference: batchtopk
  - _self_

# SAE checkpoint to load (required)
sae_checkpoint:
  experiment: "covid_analysis"  # Experiment name "cellxgene" 
  timestamp: "Aug14-17-20"  # Format: %b%d-%H-%M from training "May11-10-50"
  # Will load: experiments/${experiment}/${timestamp}/model.pth
  # And config: experiments/${experiment}/${timestamp}/.hydra/config.yaml

output:
  format: h5  # h5: token-level features (gene-level analyses, induction max); pooled: per-cell max (.pt)
  tag: ""     # appended to the file name, e.g. "_covid" -> features-<timestamp>_covid.h5


hydra:
  job:
    chdir: False 
  run:
    dir: cached_features/${sae_checkpoint.experiment}/
  job_logging:
    handlers:
      file:
        filename: ${hydra.run.dir}/run.log