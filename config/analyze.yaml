# SAE checkpoint to load (required)
sae_checkpoint:
  experiment: "multiprocessing"
  timestamp: "Apr29-11-30" # Format: %b%d-%H-%M from training
  # Will load: experiments/${experiment}/${timestamp}/model.pth
  # And config: experiments/${experiment}/${timestamp}/.hydra/config.yaml

analysis:
  input: auto  # generate_features output to read: h5 (token-level), pooled (.pt), or auto (h5 if present)
  tag: ""      # generate_features output.tag; results go to results-<timestamp><tag>.csv
  label_scoring:
    label: ["batch", "celltype"]  # obs columns (renamed via data.label_columns where they differ)
    score: ["AMI"]                # AMI and/or F1
    min_cells: 10                 # sublabels with fewer positive cells are not scored


hydra:
  job:
    chdir: False
  run:
    dir: experiments/analysis/${sae_checkpoint.experiment}/
  job_logging:
    handlers:
      file:
        filename: ${hydra.run.dir}/run.log
