# DMSO and bortezomib at 0.05 uM only, about 1:1, every cell line (partition_0.h5ad): the PCA / UMAP
# induction runs (Fig. 3b, S12-S16). Everything else on this drug uses tahoe_bortezomib_all.
defaults:
  - tahoe

name: 'tahoe_bortezomib'
file_name: 'partition_0.h5ad'
file_path: 'data/tahoe/bortezomib'
scbank: False
census: False
n_cells: [13363]
preprocess:
  counts: True
  split: 0.25  # fraction of the cells steered
